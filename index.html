<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>দাবা শিক্ষক (Daba Shikkhok)</title>
    <meta name="description" content="বাংলায় দাবা শেখার প্ল্যাটফর্ম - শিক্ষক সুলভ বিশ্লেষণ, বন্ধুত্বপূর্ণ বট ও সহজ পাঠ" />
    <meta property="og:title" content="দাবা শিক্ষক (Daba Shikkhok)" />
    <meta property="og:description" content="বাংলায় দাবা শেখার প্ল্যাটফর্ম - শিক্ষক সুলভ বিশ্লেষণ, বন্ধুত্বপূর্ণ বট ও সহজ পাঠ" />
    <meta property="og:type" content="website" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors *;" />
    <meta http-equiv="Permissions-Policy" content="interest-cohort=(), browsing-topics=(), conversion-measurement=(), join-ad-interest-group=(), run-ad-auction=()" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('dabaShikkhok:v1');
          if (raw) {
            var data = JSON.parse(raw);
            var theme = data && data.settings && data.settings.appTheme;
            if (theme === 'dark' || theme === 'paper' || theme === 'light') {
              document.documentElement.setAttribute('data-theme', theme);
              document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
              document.documentElement.classList.add('theme-' + theme);
              if (theme === 'dark') document.documentElement.classList.add('dark');
              return;
            }
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.style.colorScheme = 'light';
        document.documentElement.classList.add('theme-light');
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-primary-soft selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
