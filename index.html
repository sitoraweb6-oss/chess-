<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>দাবা শিক্ষক (Daba Shikkhok)</title>
    <meta name="description" content="বাংলায় দাবা শেখার প্ল্যাটফর্ম - শিক্ষক সুলভ বিশ্লেষণ, বন্ধুত্বপূর্ণ বট ও সহজ পাঠ" />
    <meta property="og:title" content="দাবা শিক্ষক (Daba Shikkhok)" />
    <meta property="og:description" content="বাংলায় দাবা শেখার প্ল্যাটফর্ম - শিক্ষক সুলভ বিশ্লেষণ, বন্ধুত্বপূর্ণ বট ও সহজ পাঠ" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Google Fonts: Hind Siliguri -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('dabaShikkhok:v1');
          if (raw) {
            var data = JSON.parse(raw);
            var theme = data && data.settings && data.settings.appTheme;
            if (theme === 'dark') {
              document.documentElement.classList.add('theme-dark', 'dark');
            } else if (theme === 'paper') {
              document.documentElement.classList.add('theme-paper');
            } else {
              document.documentElement.classList.add('theme-light');
            }
          } else {
            document.documentElement.classList.add('theme-light');
          }
        } catch (e) {
          document.documentElement.classList.add('theme-light');
        }
      })();
    </script>
  </head>
  <body class="bg-app text-app antialiased selection:bg-primary-soft selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
